name: CI/CD - AWS DevOps Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-build-scan-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: aws-devops-platform-repo
      EC2_INSTANCE_ID: i-040abac569953b65f
      CONTAINER_NAME: aws-devops-platform-container
      ECR_REGISTRY: 106062678657.dkr.ecr.eu-west-2.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t aws-devops-platform:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aws-devops-platform:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::106062678657:role/aws-devops-platform-github-actions-role
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag aws-devops-platform:ci "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > /tmp/deploy-ec2.sh <<'REMOTE_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          CANDIDATE="aws-devops-platform-candidate"
          PREVIOUS="aws-devops-platform-previous"

          cleanup_candidate() {
            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
          }
          trap cleanup_candidate EXIT

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker pull "$IMAGE"

          cleanup_candidate
          docker run -d --name "$CANDIDATE" \
            -p 127.0.0.1:3001:3000 "$IMAGE"

          healthy=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/health; then
              healthy=1
              break
            fi
            sleep 3
          done

          if [ "$healthy" -ne 1 ]; then
            docker logs "$CANDIDATE" || true
            exit 1
          fi

          cleanup_candidate
          trap - EXIT

          docker rm -f "$PREVIOUS" >/dev/null 2>&1 || true

          if docker ps -a --format '{{.Names}}' | grep -qx "$CONTAINER_NAME"; then
            docker stop "$CONTAINER_NAME"
            docker rename "$CONTAINER_NAME" "$PREVIOUS"
          fi

          if docker run -d --name "$CONTAINER_NAME" \
            --restart unless-stopped -p 3000:3000 "$IMAGE"; then
            healthy=0
            for i in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1:3000/health; then
                healthy=1
                break
              fi
              sleep 3
            done

            if [ "$healthy" -eq 1 ]; then
              docker rm -f "$PREVIOUS" >/dev/null 2>&1 || true
              echo "Deployment and health check succeeded."
              exit 0
            fi
          fi

          docker logs "$CONTAINER_NAME" 2>/dev/null || true
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if docker ps -a --format '{{.Names}}' | grep -qx "$PREVIOUS"; then
            docker rename "$PREVIOUS" "$CONTAINER_NAME"
            docker start "$CONTAINER_NAME"
          fi

          echo "Deployment failed; rollback attempted." >&2
          exit 1
          REMOTE_SCRIPT

          DEPLOY_SCRIPT_B64=$(base64 -w 0 /tmp/deploy-ec2.sh)
           export DEPLOY_SCRIPT_B64

          jq -n --arg script "$DEPLOY_SCRIPT_B64" \
            '{commands: ["echo " + $script + " | base64 -d > /tmp/deploy-ec2.sh && chmod 700 /tmp/deploy-ec2.sh && ECR_REGISTRY=\"106062678657.dkr.ecr.eu-west-2.amazonaws.com\" ECR_REPOSITORY=\"aws-devops-platform-repo\" IMAGE_TAG=\"'"$IMAGE_TAG"'\" AWS_REGION=\"eu-west-2\" CONTAINER_NAME=\"aws-devops-platform-container\" /tmp/deploy-ec2.sh"]}' \
            > /tmp/deploy-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy aws-devops-platform commit $IMAGE_TAG" \
            --parameters file:///tmp/deploy-commands.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM deployment command: $COMMAND_ID"

          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the SSM deployment."
          exit 1

      - name: Verify deployed application health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error \
              http://18.169.183.8:3000/health; then
              echo
              echo "Application health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "Application health check failed."
          exit 1
